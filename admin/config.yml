backend:
  name: github
  repo: khanhchamphay/Cr3w.asia
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio"
    label: "Nội dung Portfolio"
    folder: "content"
    create: true
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Mô tả ngắn", name: "description", widget: "text"}
      - {label: "Nội dung chi tiết", name: "body", widget: "markdown"}
